<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="comprosody"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a0a0a"><meta name="color-scheme" content="dark">
<title>comprosody reader — register</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/icons/comprosody-180.png"><link rel="icon" type="image/png" sizes="192x192" href="/icons/comprosody-192.png"><script src="/theme-bootstrap.js"></script><link rel="stylesheet" href="/styles.css"></head>
<body class="login-page"><main class="login-shell">
  <form id="register-form" class="login-form">
    <h1>register</h1>
    <label>username or email<input name="username" autocomplete="username" autocapitalize="none" required></label>
    <label>access code<input name="accessCode" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
    <label>password<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label>
    <label>confirm password<input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label>
    <div id="register-error" class="login-error" role="alert"></div><button type="submit">register</button>
    <div class="login-switches"><a href="/login.html">sign in</a></div>
  </form>
</main><script type="module" src="/register.js"></script></body></html>
